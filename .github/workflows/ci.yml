name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inkwell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkwell_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/inkwell_test?schema=public
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Push schema to test database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
